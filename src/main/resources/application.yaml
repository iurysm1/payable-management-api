spring:
  application:
    name: payable-management-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payable_management}
    username: ${DB_USERNAME:payable}
    password: ${DB_PASSWORD:payable}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:payable}
    password: ${RABBITMQ_PASSWORD:payable}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

app:
  security:
    username: ${APP_SECURITY_USERNAME:totvs}
    password: ${APP_SECURITY_PASSWORD:totvs}
  file-storage:
    base-path: ${IMPORT_STORAGE_PATH:./data/imports}
  rabbitmq:
    payable-importation:
      exchange: payable.importation
      queue: payable.importation.requested
      routing-key: payable.importation.requested
      confirmation-timeout: 10s

server:
  servlet:
    context-path: /management/rest

logging:
  level:
    com.totvs.payablemanagementapi: INFO
