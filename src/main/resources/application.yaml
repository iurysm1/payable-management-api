spring:
  application:
    name: payable-management-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payable_management}
    username: ${DB_USERNAME:payable}
    password: ${DB_PASSWORD:payable}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
