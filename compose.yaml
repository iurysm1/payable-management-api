services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payable_management
      POSTGRES_USER: payable
      POSTGRES_PASSWORD: payable
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payable -d payable_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: payable
      RABBITMQ_DEFAULT_PASS: payable
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: payable-management-api:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payable_management
      DB_USERNAME: payable
      DB_PASSWORD: payable
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: payable
      RABBITMQ_PASSWORD: payable
      APP_SECURITY_USERNAME: ${APP_SECURITY_USERNAME:-totvs}
      APP_SECURITY_PASSWORD: ${APP_SECURITY_PASSWORD:-totvs}
      IMPORT_STORAGE_PATH: /app/data/imports
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - payable-imports:/app/data/imports
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  payable-imports:
