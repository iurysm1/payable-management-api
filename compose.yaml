services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payable_management
      POSTGRES_USER: payable
      POSTGRES_PASSWORD: payable
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payable -d payable_management"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
